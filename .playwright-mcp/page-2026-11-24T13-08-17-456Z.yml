                - paragraph [ref=f6e68]: Matcha Career AI is an AI-powered career assistant that helps users evaluate their professional profile and make informed career decisions. Built with a multi-agent architecture using LangGraph, FastAPI, and React, the platform provides skill gap analysis, CV and LinkedIn reviews, ATS compatibility scoring, personalized learning roadmaps, and job description matching. By combining Large Language Models, semantic search, and machine learning, Matcha delivers adaptive, context-aware career guidance through a single interactive platform.
