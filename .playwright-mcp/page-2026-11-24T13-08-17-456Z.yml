                - paragraph [ref=f6e108]: Smart Agro IoT is an intelligent fertigation system designed to automate nutrient mixing, irrigation, and environmental monitoring for hydroponic and agricultural applications. Built with ESP32-based IoT devices, the system continuously monitors pH, TDS, water temperature, water level, and soil moisture while automatically controlling pumps, solenoid valves, and nutrient dosing through a Finite State Machine (FSM). Integrated with a web dashboard, Smart Agro IoT enables real-time monitoring, remote control, and data-driven fertigation management to improve efficiency and consistency.
